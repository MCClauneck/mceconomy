/*
 * Root build for the consolidated MCEconomy monorepo.
 *
 * Shared configuration for every subproject lives here. Each module applies
 * its own plugins and declares its own dependencies, but the group, version
 * and Java toolchain are defined once for all of them.
 */

plugins {
    // Declared here so subprojects can apply it without repeating the version.
    id 'com.gradleup.shadow' version '9.4.1' apply false
}

allprojects {
    group = project.property('project-group')
    version = project.property('project-version')
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
