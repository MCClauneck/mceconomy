plugins {
    id 'java-library'
    id 'maven-publish'
}

// Published POM description. The GitHub Packages repository, the
// mceconomy-{module} artifactId and the rest of the POM come from the
// io.github.mcengine.build-logic convention plugin applied by the root build.
description = "MCClauneck Plugin Bukkit"

repositories {
    // Module-specific repositories only; mavenCentral is provided by the root build.
    // No GitHub Packages registry is declared: MCEconomy depends on no MCOriax
    // plugin, so consumers of the published library inherit none either.
    maven {
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        url = 'https://oss.sonatype.org/content/repositories/snapshots'
    }
}

dependencies {
    // The platform modules shade api, common, and bukkit into the distributable
    // jar, so this module references them compileOnly to avoid pulling them into
    // its own published artifact — the platform is what implements them into the jar.
    compileOnly project(':api')
    compileOnly project(':common')
    compileOnly project(':tools')
    compileOnly 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'

    testImplementation project(':api')
    testImplementation project(':common')
    testImplementation project(':tools')
    testImplementation 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

base {
    archivesName = "MCEconomyBukkit"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = "${rootProject.name}-${project.name}"
                description = project.description
            }
        }
    }
}
