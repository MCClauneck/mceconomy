plugins {
    id 'java'
    id 'maven-publish'
}

// Published POM description; the rest of the publishing setup is shared from the
// root build.
description = "MCClauneck Plugin Common"

dependencies {
    compileOnly project(':api')

    compileOnly 'com.zaxxer:HikariCP:7.0.2'
    compileOnly 'org.mongodb:mongodb-driver-sync:5.7.0'

    compileOnly 'com.google.code.gson:gson:2.14.0'

    testImplementation project(':api')
    // The SQLite round-trip test runs the real driver and pool the plugin.yml libraries ship.
    testImplementation 'com.zaxxer:HikariCP:7.0.2'
    testRuntimeOnly 'org.xerial:sqlite-jdbc:3.53.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

base {
    archivesName = "MCEconomyCommon"
}
