# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true

# --- Project Identity ---
project-group=io.github.mcclauneck
git-org-name=MCClauneck
git-repository=mceconomy
git-repository-id=

# --- Versioning ---
# Major.Minor.Patch (SemVer). Don't update project-version until ready for release.
project-version=1.6.0

# --- Host plugin runtime target ---
# MCEconomy no longer compiles against MCIdentity: the host is bound reflectively
# at enable time (see bukkit/host/), so this is not a dependency coordinate. It
# records the MCIdentity release the bridge is written and tested against, and is
# what every platform plugin.yml 'depend: [MCIdentity]' block means.
mcidentity-version=4.0.1
