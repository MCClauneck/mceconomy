name: ${name}
version: ${version}
main: io.github.mcclauneck.mceconomy.papermc.MCEconomyPlugin

api-version: '1.20'
author: MCClauneck
description: A plugin for PaperMC

softdepend: [MCIdentity, MCAgents]

commands:
  balance:
    description: Open your balance GUI (your active identity with MCIdentity).
    usage: /balance
    permission: mcclauneck.mceconomy.command.balance
  pay:
    description: Pay another player (their active identity with MCIdentity).
    usage: /pay <player> <currency> <amount>
    permission: mcclauneck.mceconomy.command.pay

permissions:
  mcclauneck.mceconomy.tool.*:
    description: Every MCEconomy AI tool every player may use. MCAgents only offers a player the tools they are OP for or hold the node of.
    default: true
    children:
      mcclauneck.mceconomy.tool.economy_list_currencies: true
      mcclauneck.mceconomy.tool.economy_get_my_balances: true
  mcclauneck.mceconomy.tool.economy_list_currencies:
    description: Let the AI list the currencies.
    default: true
  mcclauneck.mceconomy.tool.economy_get_my_balances:
    description: Let the AI read your balances.
    default: true
  mcclauneck.mceconomy.*:
    description: Grants every MCEconomy command.
    default: op
    children:
      mcclauneck.mceconomy.tool.*: true
      mcclauneck.mceconomy.command.balance: true
      mcclauneck.mceconomy.command.pay: true

  mcclauneck.mceconomy.command.balance:
    description: Open your own balance GUI with /balance.
    default: true

  mcclauneck.mceconomy.command.pay:
    description: Pay another player from your own account with /pay.
    default: true

libraries:
  - org.xerial:sqlite-jdbc:3.53.0.0
  - com.zaxxer:HikariCP:7.0.2
  - org.mongodb:mongodb-driver-sync:5.7.0
