enable: false

# -----------------------------------------------------------------------------
#  AI agent
# -----------------------------------------------------------------------------
#  The OpenRouter API key and models this plugin's agent work runs on.
#
#  'token' is the OpenRouter API key; the other nine keys name the model for
#  each modality: text, image, video, speech, decisions, embeddings, rerank,
#  transcription and audio.
#
#  'global' uses the value MCAgents is configured with — the same key under
#  'agents' in plugins/MCAgents/config.yml — read at runtime, so the whole
#  server shares one key and one model per modality. 'token' may instead hold
#  an OpenRouter API key of this plugin's own, and any modality an OpenRouter
#  model id such as 'openrouter/free'. A 'model' key left over from an older
#  config.yml is read as the text model.
# -----------------------------------------------------------------------------
agents:
  token: global
  text: global
  image: global
  video: global
  speech: global
  decisions: global
  embeddings: global
  rerank: global
  transcription: global
  audio: global

# Currencies that the plugin guarantees to exist, keyed by their unique,
# lower-case system code:
#   - display_name: the human-readable name shown to players.
#   - transferable: true when the currency may move between accounts (for
#     example with /pay); false locks it to the account that earned it.
#     Defaults to true when omitted.
#   - texture: the base64 head texture rendering the currency in the
#     /balance GUI; a plain player head is shown when omitted.
# Add, remove, or rename entries freely to define your own custom currencies.
# Any listed currency that is missing is created when the plugin enables, and
# a changed display name or transferable flag is applied on the next enable.
