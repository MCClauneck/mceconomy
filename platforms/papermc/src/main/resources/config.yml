database:
  # Options: sqlite, postgresql, mysql, mongodb, api
  type: "sqlite"
  
  sqlite:
    file: "economy.db"
    
  postgresql:
    host: "localhost"
    port: 5432
    database: "economy"
    username: "postgres"
    password: "password"
    
  mysql:
    host: "localhost"
    port: 3306
    database: "economy"
    username: "root"
    password: "password"
    
  mongodb:
    uri: "mongodb://localhost:27017"
    database: "economy"

  # Remote central API backend (MCEngine server-expressjs).
  # Forwards all economy operations to the server over HTTP.
  api:
    url: "http://localhost:3000"
    token: "your-api-token"
