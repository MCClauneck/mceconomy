# Economy data storage backend.
# type: sqlite (default, zero configuration local file), mysql, postgresql,
# mongodb, or central (the MCEconomy central REST server configured below).
database:
  type: "sqlite"
  sqlite:
    # File name inside the plugin data folder
    file: "economy.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "economy"
    username: "root"
    password: "password"
  postgresql:
    host: "localhost"
    port: 5432
    database: "economy"
    username: "postgres"
    password: "password"
  mongodb:
    uri: "mongodb://localhost:27017"
    database: "economy"

# Central server owning all economy data, used when database.type is
# "central". Every game server on the network points at the same deployment.
central_server:
  # Base URL of the central server (no trailing slash)
  url: "https://server.com"
  # Bearer token matching the central server SERVER_API_TOKEN value
  token: ""
  # HTTP request timeout in seconds
  timeout_seconds: 10
