enable: false

# Currencies that the plugin guarantees to exist, keyed by their unique,
# lower-case system code:
#   - display_name: the human-readable name shown to players.
#   - transferable: true when the currency may move between accounts (for
#     example with /pay); false locks it to the account that earned it.
#     Defaults to true when omitted.
#   - texture: the base64 head texture rendering the currency in the
#     /balance GUI; a plain player head is shown when omitted.
# Add, remove, or rename entries freely to define your own custom currencies.
# Any listed currency that is missing is created when the plugin enables, and
# a changed display name or transferable flag is applied on the next enable.
# (The legacy list format "code,Display Name,transferable" is still accepted.)
