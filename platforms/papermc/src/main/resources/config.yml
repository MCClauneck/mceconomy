enable: false

# Currencies that the plugin guarantees to exist.
# Each entry is written as "code,Display Name,transferable":
#   - code: the unique, lower-case system code stored in the database.
#   - Display Name: the human-readable name shown to players.
#   - transferable: true when the currency may move between accounts (for
#     example with a pay command); false locks it to the account that earned
#     it. Defaults to true when omitted.
# Add, remove, or rename entries freely to define your own custom currencies.
# Any listed currency that is missing is created when the plugin enables, and
# a changed display name or transferable flag is applied on the next enable.
currencies:
  - coin,Coin,true
  - copper,Copper,true
  - silver,Silver,true
  - gold,Gold,false
  - point,Point,false
  - token,Token,false

database:
  # Options: sqlite, postgresql, mysql, mongodb, api
  type: "sqlite"
  
  sqlite:
    file: "economy.db"
    
  postgresql:
    host: "localhost"
    port: 5432
    database: "economy"
    username: "postgres"
    password: "password"
    
  mysql:
    host: "localhost"
    port: 3306
    database: "economy"
    username: "root"
    password: "password"
    
  mongodb:
    uri: "mongodb://localhost:27017"
    database: "economy"

  # Remote central API backend (MCEngine server-expressjs).
  # Forwards all economy operations to the server over HTTP.
  api:
    url: "http://localhost:3000"
    token: "your-api-token"
