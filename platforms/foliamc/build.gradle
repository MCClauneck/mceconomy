plugins {
    id 'java'
    id 'com.gradleup.shadow'
}

repositories {
    // mavenCentral and the Java toolchain are provided by the root build.
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    // The engine module is the single distributed jar and shades api/common/bukkit
    // exactly once, so this platform module references the shared modules
    // compileOnly and ships only its own entry point and Folia scheduler classes.
    compileOnly project(':api')
    compileOnly project(':common')
    compileOnly project(':bukkit')

    compileOnly 'org.xerial:sqlite-jdbc:3.53.0.0'

    compileOnly 'dev.folia:folia-api:26.3.build.+'

    // compileOnly is not inherited by the test source set, so give tests the
    // shared Bukkit layer explicitly.
    testImplementation project(':bukkit')
}

jar {
    enabled = false
}

// Disable Gradle Module Metadata generation to ensure consumers pull the shadow jar
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()

    // Ensure all implementation dependencies are shadowed
    configurations = [project.configurations.runtimeClasspath]
}

processResources {
    def props = [
        version: project.version,
        group: project.group,
        name: 'MCEconomy'
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

base {
    archivesName = "MCEconomyFoliaMC"
}

build.dependsOn shadowJar
